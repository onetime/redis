# fly.toml app configuration file generated for onetime-us-staging-redis on 2024-10-22T21:53:50-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'onetime-us-staging-redis'
primary_region = 'ord'

[build]
  image = 'flyio/redis:6.2.6'

[[mounts]]
  source = 'redis_server'
  destination = '/data'

[[vm]]
  size = 'shared-cpu-1x'

[[metrics]]
  port = 9091
  path = '/metrics'
  https = false
